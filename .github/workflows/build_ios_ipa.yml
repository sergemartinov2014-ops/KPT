name: Build iOS IPA for Sideloading (No Apple Developer Account needed)

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  build-ios:
    # Apple Silicon (macos-latest/macos-15) runners are heavily oversubscribed:
    # jobs can be cancelled with "not acquired by Runner ... after multiple
    # attempts". The Intel macOS 15 image has the same Xcode 16 toolchain and
    # is much easier to acquire.
    runs-on: macos-15-intel
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.8'
          channel: 'stable'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Build iOS App (Release, obfuscated, unsigned)
        run: flutter build ios --release --no-codesign --obfuscate --split-debug-info=build/symbols/ios

      - name: Upload debug symbols
        uses: actions/upload-artifact@v4
        with:
          name: somnia-ios-symbols
          path: build/symbols/
          if-no-files-found: ignore

      - name: Package into IPA
        run: |
          set -euo pipefail
          rm -rf build/ios/ipa
          mkdir -p build/ios/ipa/Payload
          test -d build/ios/iphoneos/Runner.app
          cp -R build/ios/iphoneos/Runner.app build/ios/ipa/Payload/
          cd build/ios/ipa
          zip -r -y somnia.ipa Payload

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: somnia-ios-ipa
          path: build/ios/ipa/somnia.ipa
          if-no-files-found: error
